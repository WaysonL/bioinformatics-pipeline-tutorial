<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Insights MVP</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a31;
        --muted: #8fa1c7;
        --text: #e9efff;
        --primary: #5a8bff;
        --primary-2: #6aa8ff;
        --ok: #18c29c;
        --warn: #f4b740;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top right, #1c2d59 0%, var(--bg) 40%);
        color: var(--text);
      }
      .container { max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      .sub { color: var(--muted); margin: 0 0 24px; }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin-bottom: 20px;
      }
      input {
        border: 1px solid #2e3e6f;
        background: #101733;
        color: var(--text);
        border-radius: 10px;
        padding: 12px 14px;
        width: 100%;
      }
      button {
        border: 0;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
        color: white;
        border-radius: 10px;
        padding: 0 18px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .status { margin: 8px 0 20px; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 16px;
      }
      .card {
        background: color-mix(in srgb, var(--panel) 90%, black);
        border: 1px solid #26345e;
        border-radius: 14px;
        padding: 16px;
      }
      .card h2 { margin-top: 0; font-size: 20px; }
      .tag { display: inline-block; margin-right: 8px; padding: 3px 8px; border-radius: 999px; background: #22305b; color: #c6d5ff; font-size: 12px; }
      ul { padding-left: 18px; }
      .hot-topic { margin-bottom: 12px; border-left: 2px solid var(--warn); padding-left: 10px; }
      .error { color: var(--danger); }
      .muted { color: var(--muted); }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎬 视频分析控制台</h1>
      <p class="sub">上传前先用链接体验：自动生成转写、摘要、结构化总结、热点关联。</p>

      <div class="toolbar">
        <input id="videoUrl" placeholder="请输入视频链接，例如 https://example.com/video" />
        <button id="analyzeBtn">开始分析</button>
      </div>

      <div id="status" class="status">等待输入链接…</div>

      <div class="grid">
        <section class="card">
          <h2>摘要输出</h2>
          <p id="oneLiner" class="muted">暂无摘要</p>
          <h3>关键要点</h3>
          <ul id="keyPoints"><li class="muted">暂无数据</li></ul>
          <h3>结构化总结</h3>
          <p><span class="tag">背景</span> <span id="bg" class="muted">-</span></p>
          <p><span class="tag">论点</span> <span id="args" class="muted">-</span></p>
          <p><span class="tag">结论</span> <span id="conclusion" class="muted">-</span></p>
        </section>

        <section class="card">
          <h2>热点关联</h2>
          <div id="hotTopics"><p class="muted">暂无热点</p></div>
          <h3>转写片段</h3>
          <p id="transcript" class="muted">暂无转写</p>
        </section>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const buttonEl = document.getElementById('analyzeBtn');

      function setLoading(loading) {
        buttonEl.disabled = loading;
        buttonEl.textContent = loading ? '分析中...' : '开始分析';
      }

      function renderResult(data) {
        document.getElementById('oneLiner').textContent = data.summary.one_liner;
        document.getElementById('transcript').textContent = data.transcript;

        const list = document.getElementById('keyPoints');
        list.innerHTML = '';
        data.summary.key_points.forEach((item) => {
          const li = document.createElement('li');
          li.textContent = item;
          list.appendChild(li);
        });

        const structured = data.summary.structured_summary;
        document.getElementById('bg').textContent = structured.background || '-';
        document.getElementById('args').textContent = structured.arguments || '-';
        document.getElementById('conclusion').textContent = structured.conclusion || '-';

        const hotTopics = document.getElementById('hotTopics');
        hotTopics.innerHTML = '';
        data.hot_topics.forEach((topic) => {
          const div = document.createElement('div');
          div.className = 'hot-topic';
          div.innerHTML = `<strong>${topic.title}</strong><br/><span class="muted">${topic.source} · ${new Date(topic.published_at).toLocaleString()}</span><br/>${topic.relevance_reason}`;
          hotTopics.appendChild(div);
        });
      }

      document.getElementById('analyzeBtn').addEventListener('click', async () => {
        const videoUrl = document.getElementById('videoUrl').value.trim();
        if (!videoUrl) {
          statusEl.textContent = '请先输入视频链接';
          statusEl.className = 'status error';
          return;
        }

        setLoading(true);
        statusEl.textContent = '正在提交分析任务...';
        statusEl.className = 'status';

        try {
          const createRes = await fetch('http://127.0.0.1:8000/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ video_url: videoUrl, language: 'zh' })
          });
          if (!createRes.ok) throw new Error(`提交失败: ${createRes.status}`);

          const created = await createRes.json();
          statusEl.textContent = `任务创建成功 (${created.task_id})，正在加载结果...`;

          const resultRes = await fetch(`http://127.0.0.1:8000/api/tasks/${created.task_id}`);
          if (!resultRes.ok) throw new Error(`查询结果失败: ${resultRes.status}`);

          const payload = await resultRes.json();
          renderResult(payload);
          statusEl.textContent = '分析完成 ✅';
        } catch (err) {
          statusEl.textContent = `发生错误：${err.message}`;
          statusEl.className = 'status error';
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
